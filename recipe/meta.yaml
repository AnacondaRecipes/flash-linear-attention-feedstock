{% set name = "flash-linear-attention" %}
{% set version = "0.4.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 127ee7273ed15ac17f72bcf4c75e1051719d8fbe0a2d1d047e59406f36d81ee2

build:
  number: 0
  # fla-core ==0.4.1 (a hard run dep) is only available on linux-64 on pkgs/main
  skip: true  # [not (linux and x86_64)]
  # upstream requires-python >=3.10
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python
    # fla-core provides the fla.ops/fla.modules half of the fla namespace and
    # transitively supplies einops/packaging/triton/pytorch that this package
    # also imports; upstream 0.4.1 declares only these two base dependencies.
    - fla-core =={{ version }}
    - transformers
  run_constrained:
    # `conv1d` extra (optional short-convolution kernels); bound from upstream
    # pyproject [project.optional-dependencies]
    - causal-conv1d >=1.4.0

test:
  imports:
    - fla
    # fla/__init__.py comes from fla-core and swallows ImportError for fla.models;
    # import fla.models directly to actually exercise this package's content
    - fla.models
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/fla-org/flash-linear-attention
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Fast linear attention models and layers
  description: |
    flash-linear-attention provides efficient Triton-based implementations of
    linear-attention and related sub-quadratic sequence-modeling layers and
    models (built on fla-core), packaged as the fla.layers and fla.models
    extensions of the fla namespace for use with PyTorch and transformers.
  doc_url: https://github.com/fla-org/flash-linear-attention
  dev_url: https://github.com/fla-org/flash-linear-attention

extra:
  recipe-maintainers:
    - chrisdeutsch
